# Appearance of the demo UI (ui/app.py). Nothing here changes what the agent does.

[theme]
base = "light"
primaryColor = "#1f3a5f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1c1f24"
linkColor = "#1f3a5f"
codeBackgroundColor = "#eef2f7"
borderColor = "#dde3ea"
baseRadius = "6px"
font = "sans-serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
