# Synthetic "internal inventory" database, joined to the Zetaris compose network so the
# Zetaris query engine can register it as a JDBC datasource (host name: orgdb).
# Start:  docker compose --env-file ../../.env -f infra/orgdb/docker-compose.yml up -d
name: depriskr
services:
  orgdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orgdata
      POSTGRES_PASSWORD: ${ORGDB_PASSWORD:?set ORGDB_PASSWORD in .env}
      POSTGRES_DB: orgdata
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../../data/sample:/seed:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orgdata -d orgdata"]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  default:
    name: zetaris_default
    external: true
