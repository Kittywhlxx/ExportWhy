# Spark settings for the query engine. Read at startup; restart the driver to apply:
#
#   docker compose restart driver
#
# Heap and cores are NOT set here -- they come from ZSPARK_DRIVER_MEM, ZSPARK_DRIVER_CORES
# and ZSPARK_MASTER_URL in .env, because the driver is launched with them on the command
# line and a command line wins over this file.
#
# Everything below is commented out and shows Spark's default. Uncomment to change one.

# Number of partitions a shuffle produces. The default suits a cluster, not one machine:
# 200 partitions over 2 cores means 200 tasks queueing, and most of them tiny. Setting it
# near your core count is usually the single biggest win on a laptop.
# spark.sql.shuffle.partitions        200

# Fraction of the heap Spark uses for execution and caching together. The rest is left for
# your query's own objects. Raise it if queries spill to disk; lower it on OutOfMemoryError.
# spark.memory.fraction               0.6

# Of that fraction, how much is held for cached data rather than released to execution.
# spark.memory.storageFraction        0.5

# Tables smaller than this are broadcast to every task instead of shuffled. Raising it
# speeds up joins against small dimension tables, at the cost of heap per task.
# spark.sql.autoBroadcastJoinThreshold   10MB

# Let Spark re-plan a query while it runs, using the sizes it actually observes. On by
# default and worth leaving on; it is what makes a wrong partition count survivable.
# spark.sql.adaptive.enabled          true
# spark.sql.adaptive.coalescePartitions.enabled  true

# Where shuffle and spill files are written. Point this at a fast disk if the default
# fills up -- a large join can write several GB.
# spark.local.dir                     /tmp
